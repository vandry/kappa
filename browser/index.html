<html>
  <head>
    <link rel="stylesheet" href="browser.css">
    <title>Kappa</title>
  </head>
  <body>
    <div class="section">
      <div class="sectiontitle">Status</div>
      <div id="status"></div>
    </div>
    <div class="section">
      <div class="sectiontitle">Namespaces</div>
      <input type="checkbox" id="namespace_all">
      <label for="namespace_all">All</label>
      <span style="display: none;" id="namespace_template">
        | <input type="checkbox" class="namespace_select">
          <button type="button" class="namespace_only">Only</button>
          <label class="namespace_name"></label>
      </span>
    </div>
    <div class="section">
      <div class="sectiontitle">Pods</div>
      <table>
        <thead>
          <tr><th>Namespace</th><th>Name</th><th></th></tr>
        </thead>
        <tbody id="pods">
        </tbody>
      </table>
    </div>
    <script src="browser.js"></script>
  </body>
</html>
